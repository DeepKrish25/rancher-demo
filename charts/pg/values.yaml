# Default state committed to git — same as your real cluster.yaml.
# A fresh cluster always bootstraps via initdb.
name: demo-pg
namespace: default

instances: 1
storageSize: 1Gi

bootstrap:
  # Valid rendering states: initdb, recovery, existing.
  # `existing` omits spec.bootstrap after a successful recovery.
  mode: initdb
  recovery:
    # Name of the externalClusters entry from which CNPG recovers.
    source: original
    # Archive identity of the source Cluster in object storage.
    serverName: demo-pg

backup:
  destinationPath: s3://pg-backups/
  endpointURL: http://minio.minio.svc.cluster.local:9000
  secretName: minio-creds
  # Used for recovery mode so future backups do not write to the source archive.
  serverName: demo-pg-recovered

scheduledBackup:
  enabled: true
  schedule: "0 0 2 * * *"   # 2am daily, CNPG cron format (with seconds)
