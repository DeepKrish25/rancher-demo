apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-pg
  namespace: argocd
spec:
  project: default
  source:
    # >>> EDIT THIS to your own git repo URL after you push this folder <<<
    repoURL: https://github.com/DeepKrish25/rancher-demo.git
    targetRevision: main
    path: charts/pg
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  # Demonstration only: leave this disabled for the manual-drift scenario.
  # It is deliberately not part of the Git-driven recovery architecture.
  # To reproduce the old ignoreDifferences/comparePatches workaround, use
  # scripts/07-apply-fix.sh and uncomment this block at spec level:
  # ignoreDifferences:
  #   - group: postgresql.cnpg.io
  #     kind: Cluster
  #       jsonPointers:
  #         - /spec/bootstrap
